# Docker profile — all service names resolve via Docker Compose DNS
spring.ai.ollama.base-url=http://ollama:11434
spring.ai.mcp.client.streamable-http.connections.accounts.url=http://account-service:8081
spring.ai.mcp.client.streamable-http.connections.transactions.url=http://transaction-service:8082

# Enable service discovery in Docker
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://config-service:8888
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/
