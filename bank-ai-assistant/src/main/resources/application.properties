spring.application.name=bank-ai-assistant
server.port=8083

# ── Ollama (local LLM) ──────────────────────────────────────────────────────
# Make sure Ollama is running: ollama serve
# Pull the model first:        ollama pull llama3.2
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.num-ctx=8192

# ── MCP Clients — account-service and transaction-service expose MCP tools ──
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.accounts.url=${ACCOUNT_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.streamable-http.connections.transactions.url=${TRANSACTION_MCP_URL:http://localhost:8082}

# ── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.name=BankAI Assistant
info.app.description=Agentic AI banking assistant powered by Ollama + llama3.2 with MCP tool integration
info.app.model=llama3.2

# ── Infrastructure (disabled for local dev; enabled via docker profile) ──────
spring.cloud.config.enabled=false
eureka.client.enabled=false
